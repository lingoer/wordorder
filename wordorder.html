<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Builder</title>
    <style>
        :root { --bg-1: #f1f5f9; --bg-2: #ffffff; --bg-3: #f8fafc; --bg-4: #e2e8f0; }
        body { background: var(--bg-1); font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0; padding: 16px; box-sizing: border-box; }
        * { box-sizing: border-box; }
        .card { width: 100%; max-width: 500px; background: var(--bg-2); padding: 16px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 12px; }
        .hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .hdr h1 { margin: 0; font-size: 20px; color: #1e293b; }
        .btn-n { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; }
        .btn-n:disabled { background: #94a3b8; cursor: not-allowed; }
        .diff-row { display: flex; justify-content: space-between; align-items: center; }
        .diff-lbl { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
        .diff-toggle { display: flex; gap: 6px; }
        .diff-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .diff-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .img-bx { width: 100%; height: 220px; background: var(--bg-4); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #cbd5e1; text-align: center; }
        .dz-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .dz-lbl { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; display: block; }
        .stage-lbl { font-size: 11px; font-weight: 700; color: #2563eb; }
        .btn-r { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .btn-r:hover { background: #e2e8f0; }
        .dz { width: 100%; min-height: 52px; border: 2px dashed #cbd5e1; background: var(--bg-3); border-radius: 12px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .dz-the { background: #cbd5e1; color: #475569; padding: 5px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; user-select: none; }
        .dz-locked { padding: 5px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; color: white; opacity: 0.8; user-select: none; }
        .dz-seg { display: flex; align-items: center; min-height: 28px; min-width: 40px; border-bottom: 2px dotted #cbd5e1; border-radius: 6px; transition: background-color 0.15s, outline 0.15s; }
        .dz-seg.drop-hover { outline: 2px solid #2563eb; outline-offset: 1px; background: #dbeafe; }
        .btn-c { width: 100%; background: #059669; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .fb { text-align: center; font-weight: 500; padding: 10px; border-radius: 12px; margin-top: 6px; display: none; }
        .wrapper { padding: 8px; border-radius: 12px; margin-bottom: 6px; border: 1px solid rgba(0,0,0,0.05); }
        .lbl { font-size: 11px; font-weight: 700; display: block; margin-bottom: 4px; }
        .box { min-height: 44px; display: flex; flex-wrap: wrap; gap: 6px; }
        .w-crd { padding: 5px 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: grab; color: white; user-select: none; touch-action: none; }
        .w-crd.dragging { opacity: 0.35; cursor: grabbing; }
        .drag-ghost { position: fixed; z-index: 9999; pointer-events: none; opacity: 0.92; transform: translate(-50%, -100%); box-shadow: 0 6px 16px -4px rgba(0,0,0,0.35); }
        .bg-subjects { background-color: #3b82f6; }
        .bg-verbs { background-color: #22c55e; }
        .bg-adjectives { background-color: #a855f7; }
        .bg-objects { background-color: #f59e0b; }
        .bg-prepositions { background-color: #ec4899; }
        .bg-articles { background-color: #14b8a6; }
        .categories { display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div class="card">
        <div class="hdr">
            <h1>✨ Sentence Builder</h1>
            <button id="next-btn" class="btn-n">Next 🔄</button>
        </div>
        <div class="diff-row">
            <span class="diff-lbl">Difficulty:</span>
            <div class="diff-toggle">
                <button id="diff-beginner" class="diff-btn active" data-level="beginner">Beginner</button>
                <button id="diff-intermediate" class="diff-btn" data-level="intermediate">Intermediate</button>
            </div>
        </div>
        <div class="img-bx">
            <div id="image-loader">Loading artwork...</div>
            <img id="game-image" style="width:100%; height:100%; object-fit:contain; display:none;" alt="Game Scene" />
        </div>
        <div>
            <div class="dz-row">
                <span class="dz-lbl">Drop words here: <span id="stage-label" class="stage-lbl"></span></span>
                <button id="reset-btn" class="btn-r">Reset ↺</button>
            </div>
            <div id="sentence-dropzone" class="dz"></div>
        </div>
        <div>
            <button id="check-btn" class="btn-c">Check Answer 🔎</button>
            <div id="feedback-message" class="fb"></div>
        </div>
        <div class="categories">
            <div class="wrapper" style="background:#eff6ff;"><span class="lbl" style="color:#2563eb;">Subjects</span><div id="pool-subjects" class="box"></div></div>
            <div class="wrapper" style="background:#f0fdf4;"><span class="lbl" style="color:#16a34a;">Verbs</span><div id="pool-verbs" class="box"></div></div>
            <div class="wrapper" style="background:#f3e8ff;"><span class="lbl" style="color:#9333ea;">Adjectives</span><div id="pool-adjectives" class="box"></div></div>
            <div class="wrapper" style="background:#fffbeb;"><span class="lbl" style="color:#d97706;">Objects</span><div id="pool-objects" class="box"></div></div>
            <div class="wrapper" style="background:#fdf2f8;"><span class="lbl" style="color:#db2777;">Prepositions</span><div id="pool-prepositions" class="box"></div></div>
            <div class="wrapper" style="background:#f0fdfa;"><span class="lbl" style="color:#0d9488;">Articles</span><div id="pool-articles" class="box"></div></div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://wordorder.lingoer.workers.dev";
        let draggedElement = null;
        let activePointerId = null;
        let ghostEl = null;
        let hoverTarget = null;
        let wrongAttempts = 0; // resets on every stage transition, not just on a new puzzle
        let difficulty = "beginner";

        // --- Staged-puzzle state (carried over from index_11) ----------------------------------
        // `template` is the FULL sentence as an ordered list of tokens (fixed text and slots),
        // each carrying the stage number it's revealed on. `stagePools` has one entry per stage:
        // the word pools active that stage, and the expected cumulative sentence text once that
        // stage is solved. `activeSegments` holds only the CURRENT stage's empty/fillable blanks
        // (everything from earlier stages renders as plain locked text, not draggable).
        //
        // index_12 changes vs index_11 (matching worker28's compound-predicate rewrite):
        //   - a 6th "Articles" pool box/category, active only at Intermediate difficulty (at
        //     Beginner the article is baked into the template as fixed {type:"text"} tokens, so
        //     the "articles" category never appears in that stage's pools and the wrapper hides
        //     itself automatically via the existing show/hide-by-active-category logic).
        //   - multi-word subjects: worker28 can now emit 1 OR 2 subject-category tokens at stage
        //     1 (e.g. "construction" + "worker" as two separate ordered blanks). No client change
        //     was needed for this — renderStage() already renders one blank per token regardless
        //     of how many tokens share a category and a stage, and evaluateSentence() already
        //     grades every blank in activeSegments independently. Verified against the worked
        //     example below.
        let template = [];
        let stagePools = [];
        let totalStages = 1;
        let currentStage = 1;
        let activeSegments = [];

        const OFFLINE_IMAGE = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">' +
            '<rect width="100%" height="100%" fill="#e2e8f0"/>' +
            '<text x="50%" y="46%" font-family="system-ui, sans-serif" font-size="30" fill="#64748b" text-anchor="middle">👷 Offline demo</text>' +
            '<text x="50%" y="58%" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Worker unreachable — using local fallback</text>' +
            '</svg>'
        );

        // Offline fallback matching worker28's compound-predicate response shape — this is the
        // user's own worked example: "the happy construction worker is holding a bun and
        // standing near a stool" (Intermediate: two-word subject as two pills, draggable
        // articles, a compound "and"-joined second action, adjective revealed last).
        const mockData = {
            "image_url": OFFLINE_IMAGE,
            "difficulty": "intermediate",
            "template": [
                { "type": "text", "text": "the", "stage": 1 },
                { "type": "slot", "category": "adjectives", "value": "happy", "stage": 4 },
                { "type": "slot", "category": "subjects", "value": "construction", "stage": 1 },
                { "type": "slot", "category": "subjects", "value": "worker", "stage": 1 },
                { "type": "text", "text": "is", "stage": 1 },
                { "type": "slot", "category": "verbs", "value": "holding", "stage": 1 },
                { "type": "slot", "category": "articles", "value": "a", "stage": 2 },
                { "type": "slot", "category": "objects", "value": "bun", "stage": 2 },
                { "type": "text", "text": "and", "stage": 3 },
                { "type": "slot", "category": "verbs", "value": "standing", "stage": 3 },
                { "type": "slot", "category": "prepositions", "value": "near", "stage": 3 },
                { "type": "slot", "category": "articles", "value": "a", "stage": 3 },
                { "type": "slot", "category": "objects", "value": "stool", "stage": 3 }
            ],
            "total_stages": 4,
            "stage_pools": [
                { "stage": 1, "target": "the construction worker is holding", "pools": { "subjects": ["construction", "chef", "scientist", "worker", "doctor", "gardener"], "verbs": ["playing", "holding", "drinking", "sleeping"] } },
                { "stage": 2, "target": "the construction worker is holding a bun", "pools": { "articles": ["an", "the", "a"], "objects": ["spoon", "book", "bun", "car"] } },
                { "stage": 3, "target": "the construction worker is holding a bun and standing near a stool", "pools": { "verbs": ["standing", "catching", "driving", "opening"], "prepositions": ["behind", "near", "in", "in front of"], "articles": ["a", "the", "an"], "objects": ["kitchen", "hat", "apple", "stool"] } },
                { "stage": 4, "target": "the happy construction worker is holding a bun and standing near a stool", "pools": { "adjectives": ["tall", "green", "yellow", "happy"] } }
            ]
        };

        const gameImage = document.getElementById("game-image");
        const imageLoader = document.getElementById("image-loader");
        const feedback = document.getElementById("feedback-message");
        const nextBtn = document.getElementById("next-btn");
        const sentenceDropzone = document.getElementById("sentence-dropzone");
        const stageLabel = document.getElementById("stage-label");
        const CATEGORIES = ["subjects", "verbs", "adjectives", "objects", "prepositions", "articles"];

        function getCategory(el) {
            const cls = Array.from(el.classList).find(c => c.startsWith("bg-"));
            return cls ? cls.replace("bg-", "") : null;
        }

        // --- Pointer Events drag-and-drop (works for mouse, touch, and pen) -----------------
        // Unchanged from index_11: only the GHOST follows the pointer during a drag; actual
        // placement (including swapping an already-filled blank's pill back to its pool) happens
        // once, on pointerup.

        function makeDraggable(el) {
            el.addEventListener("pointerdown", onPointerDown);
        }

        function positionGhost(x, y) {
            if (!ghostEl) return;
            ghostEl.style.left = x + "px";
            ghostEl.style.top = (y - 22) + "px";
        }

        function onPointerDown(e) {
            if (draggedElement) return; // one drag at a time
            const el = e.currentTarget;
            e.preventDefault();

            draggedElement = el;
            activePointerId = e.pointerId;
            el.classList.add("dragging");

            ghostEl = el.cloneNode(true);
            ghostEl.classList.remove("dragging");
            ghostEl.classList.add("drag-ghost");
            document.body.appendChild(ghostEl);
            positionGhost(e.clientX, e.clientY);
        }

        // Resolves what's under (x, y) to a drop target: a pool box, a specific blank
        // (`.dz-seg`), or null (nowhere valid). Hides the ghost first so elementFromPoint sees
        // what's actually underneath it rather than the ghost itself.
        function resolveHit(x, y) {
            ghostEl.style.display = "none";
            const hit = document.elementFromPoint(x, y);
            ghostEl.style.display = "";
            if (!hit) return null;

            const box = hit.closest(".box");
            if (box) return { type: "pool", el: box };

            const dz = hit.closest("#sentence-dropzone");
            if (dz) {
                let seg = hit.closest(".dz-seg");
                if (!seg) seg = nearestSegment(x, y); // hovering a fixed-text label or padding
                if (seg) return { type: "segment", el: seg };
            }
            return null;
        }

        function onPointerMove(e) {
            if (!draggedElement || e.pointerId !== activePointerId) return;
            positionGhost(e.clientX, e.clientY);

            const res = resolveHit(e.clientX, e.clientY);
            const nextHover = res && res.type === "segment" ? res.el : null;
            if (hoverTarget && hoverTarget !== nextHover) hoverTarget.classList.remove("drop-hover");
            hoverTarget = nextHover;
            if (hoverTarget) hoverTarget.classList.add("drop-hover");
        }

        function onPointerUp(e) {
            if (!draggedElement || e.pointerId !== activePointerId) return;
            const el = draggedElement;
            if (hoverTarget) { hoverTarget.classList.remove("drop-hover"); hoverTarget = null; }

            const res = resolveHit(e.clientX, e.clientY);
            if (res && res.type === "pool") {
                res.el.appendChild(el);
            } else if (res && res.type === "segment") {
                const existing = res.el.querySelector(".w-crd");
                if (existing && existing !== el) {
                    const cat = getCategory(existing);
                    const pool = document.getElementById(`pool-${cat}`);
                    if (pool) pool.appendChild(existing);
                }
                res.el.appendChild(el);
            }
            // Invalid drop target (blank page, between panels): el's DOM position never changed
            // during the drag, so it simply stays exactly where it already was.

            el.classList.remove("dragging");
            if (ghostEl) { ghostEl.remove(); ghostEl = null; }
            draggedElement = null;
            activePointerId = null;
        }

        document.addEventListener("pointermove", onPointerMove);
        document.addEventListener("pointerup", onPointerUp);
        document.addEventListener("pointercancel", onPointerUp);

        // Fallback segment router — only used when the pointer isn't directly over any of the
        // CURRENT stage's blanks. Measures distance to the nearest point on each blank's
        // rectangle (clamping x/y into it) rather than to its center.
        function nearestSegment(x, y) {
            if (!activeSegments.length) return null;
            let closest = activeSegments[0], closestDist = Infinity;
            activeSegments.forEach(seg => {
                const box = seg.getBoundingClientRect();
                const nx = Math.min(Math.max(x, box.left), box.right);
                const ny = Math.min(Math.max(y, box.top), box.bottom);
                const dx = x - nx, dy = y - ny;
                const dist = dx * dx + dy * dy;
                if (dist < closestDist) { closestDist = dist; closest = seg; }
            });
            return closest;
        }

        function resetPuzzle() {
            renderStage(currentStage); // rebuilding the current stage from scratch clears it
        }

        // Rebuilds the dropzone AND the word pools for stage `n`. Tokens from earlier stages
        // render as plain locked text (their answer is already settled); tokens for THIS stage
        // render as empty, fillable blanks; tokens for later stages don't render at all yet —
        // that's what makes the sentence visibly grow instead of just filling in. This loop is
        // fully generic per-token, so it renders any number of same-category, same-stage tokens
        // correctly (e.g. worker28's two-word subject "construction" + "worker" both at stage 1
        // just become two separate blanks/pills in sequence, same as any other token pair would).
        function renderStage(n) {
            sentenceDropzone.innerHTML = "";
            activeSegments = [];
            const info = stagePools[n - 1];

            template.forEach(tok => {
                if (tok.stage > n) return; // not revealed yet — literally not on screen

                if (tok.type === "text") {
                    const span = document.createElement("span");
                    span.className = "dz-the";
                    span.innerText = tok.text;
                    sentenceDropzone.appendChild(span);
                    return;
                }

                if (tok.stage < n) {
                    // Solved in an earlier stage — show as fixed, non-draggable text.
                    const span = document.createElement("span");
                    span.className = `dz-locked bg-${tok.category}`;
                    span.innerText = tok.value;
                    sentenceDropzone.appendChild(span);
                    return;
                }

                // tok.stage === n: this stage's fillable blank.
                const seg = document.createElement("div");
                seg.className = "dz-seg";
                seg.dataset.expected = tok.value;
                sentenceDropzone.appendChild(seg);
                activeSegments.push(seg);
            });

            const activeCategories = Object.keys(info.pools);
            CATEGORIES.forEach(cat => {
                const container = document.getElementById(`pool-${cat}`);
                const wrapper = container.closest(".wrapper");
                container.innerHTML = "";
                if (activeCategories.includes(cat)) {
                    wrapper.style.display = "";
                    info.pools[cat].forEach(w => {
                        const block = document.createElement("div");
                        block.className = `w-crd bg-${cat}`;
                        block.innerText = w;
                        makeDraggable(block);
                        container.appendChild(block);
                    });
                } else {
                    wrapper.style.display = "none";
                }
            });

            wrongAttempts = 0;
            feedback.style.display = "none";
            stageLabel.innerText = totalStages > 1 ? `(stage ${n} of ${totalStages})` : "";
        }

        function renderPayload(data) {
            template = data.template || [];
            stagePools = data.stage_pools || [];
            totalStages = data.total_stages || 1;
            currentStage = 1;

            feedback.style.display = "none"; gameImage.style.display = "none";
            imageLoader.style.display = "block"; imageLoader.innerText = "Loading artwork...";

            gameImage.src = data.image_url;
            gameImage.onload = () => { imageLoader.style.display = "none"; gameImage.style.display = "block"; };
            gameImage.onerror = () => { imageLoader.innerText = "⚠️ Failed to load image asset. Check network configurations."; };

            renderStage(currentStage);
        }

        async function fetchNewPuzzle() {
            nextBtn.disabled = true;
            feedback.style.display = "none";
            imageLoader.style.display = "block";
            imageLoader.innerText = "Generating a new puzzle...";
            try {
                const res = await fetch(`${WORKER_URL}?difficulty=${difficulty}`);
                const text = await res.text();
                let data;
                try { data = JSON.parse(text); } catch { throw new Error("Worker returned non-JSON response."); }
                if (!res.ok || data.error) throw new Error(data.message || `Worker responded with HTTP ${res.status}`);
                renderPayload(data);
            } catch (err) {
                showFeedback("Worker unreachable — using offline fallback puzzle.", "#fef3c7", "#92400e");
                renderPayload(mockData);
            }
            nextBtn.disabled = false;
        }

        function setDifficulty(level) {
            if (level === difficulty) return;
            difficulty = level;
            document.querySelectorAll(".diff-btn").forEach(b => b.classList.toggle("active", b.dataset.level === level));
            fetchNewPuzzle();
        }

        function evaluateSentence() {
            if (!activeSegments.length) return;
            const allFilled = activeSegments.every(seg => seg.children.length === 1);
            if (!allFilled) { showFeedback("Drag words onto the target line first!", "#fef3c7", "#92400e"); return; }

            const allCorrect = activeSegments.every(seg =>
                seg.children[0].innerText.toLowerCase().trim() === seg.dataset.expected
            );

            if (allCorrect) {
                wrongAttempts = 0;
                if (currentStage < totalStages) {
                    showFeedback("✅ Correct! Adding more detail...", "#d1fae5", "#065f46");
                    const next = currentStage + 1;
                    setTimeout(() => { currentStage = next; renderStage(currentStage); }, 900);
                } else {
                    showFeedback("🎉 Correct! Great job — full sentence complete!", "#d1fae5", "#065f46");
                }
            } else {
                wrongAttempts++;
                if (wrongAttempts >= 3) {
                    const target = stagePools[currentStage - 1].target;
                    const shown = target.charAt(0).toUpperCase() + target.slice(1) + ".";
                    showFeedback(`❌ Not quite. The answer is: "${shown}"`, "#fee2e2", "#991b1b");
                } else {
                    showFeedback("❌ Try a different combination!", "#fee2e2", "#991b1b");
                }
            }
        }

        function showFeedback(t, bg, c) { feedback.style.backgroundColor = bg; feedback.style.color = c; feedback.style.display = "block"; feedback.innerText = t; }

        document.getElementById("check-btn").addEventListener("click", evaluateSentence);
        nextBtn.addEventListener("click", fetchNewPuzzle);
        document.getElementById("reset-btn").addEventListener("click", resetPuzzle);
        document.getElementById("diff-beginner").addEventListener("click", () => setDifficulty("beginner"));
        document.getElementById("diff-intermediate").addEventListener("click", () => setDifficulty("intermediate"));
        fetchNewPuzzle();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordOrder — Pollinations Image Test</title>
<style>
  :root { --bg-1:#f1f5f9; --bg-2:#ffffff; --bg-3:#f8fafc; --bg-4:#e2e8f0; --ink:#1e293b; }
  * { box-sizing: border-box; }
  body { background: var(--bg-1); font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 24px 16px; }
  .card { width: 100%; max-width: 560px; background: var(--bg-2); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 20px; color: var(--ink); }
  p.sub { margin: 0; font-size: 13px; color: #64748b; }
  label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; display: block; margin-bottom: 6px; }
  input[type=text], textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; font-family: inherit; background: var(--bg-3); }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .img-bx { width: 100%; min-height: 260px; background: var(--bg-4); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #cbd5e1; padding: 12px; text-align: center; }
  .img-bx img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .status { font-size: 13px; padding: 10px 12px; border-radius: 10px; font-weight: 500; display: none; }
  .status.ok { display: block; background: #d1fae5; color: #065f46; }
  .status.err { display: block; background: #fee2e2; color: #991b1b; }
  .status.pending { display: block; background: #fef3c7; color: #92400e; }
  details { background: var(--bg-3); border-radius: 10px; border: 1px solid #e2e8f0; }
  summary { cursor: pointer; padding: 10px 12px; font-size: 12px; font-weight: 700; color: #475569; }
  pre { margin: 0; padding: 0 12px 12px; font-size: 12px; white-space: pre-wrap; word-break: break-all; color: #334155; }
</style>
</head>
<body>

  <div class="card">
    <div>
      <h1>🖼️ WordOrder — Image Generation Test</h1>
      <p class="sub">Calls your Cloudflare Worker, then loads the returned Pollinations image_url directly in the browser (same pattern the real game uses).</p>
    </div>

    <div>
      <label for="worker-url">Worker URL</label>
      <input type="text" id="worker-url" value="https://wordorder.lingoer.workers.dev">
    </div>

    <div>
      <label for="prompt-text">Test prompt (optional — leave blank to use the worker's default)</label>
      <textarea id="prompt-text">Act as an English grammar game data generator. Create a unique, highly visual 2D cartoon scenario involving an animal, person, or vehicle. Provide a highly detailed image generation prompt for that scenario.</textarea>
    </div>

    <button id="run-btn">Fetch &amp; Test Image ▶️</button>

    <div id="status" class="status"></div>

    <div class="img-bx">
      <div id="img-placeholder">No image requested yet.</div>
      <img id="game-image" alt="Generated scene">
    </div>

    <details>
      <summary>Raw worker response</summary>
      <pre id="raw-json">—</pre>
    </details>
  </div>

  <script>
    const workerUrlInput = document.getElementById("worker-url");
    const promptInput = document.getElementById("prompt-text");
    const runBtn = document.getElementById("run-btn");
    const statusEl = document.getElementById("status");
    const imgPlaceholder = document.getElementById("img-placeholder");
    const gameImage = document.getElementById("game-image");
    const rawJson = document.getElementById("raw-json");

    function setStatus(kind, text) {
      statusEl.className = "status " + kind;
      statusEl.textContent = text;
    }

    async function runTest() {
      const base = workerUrlInput.value.trim().replace(/\/+$/, "");
      const prompt = promptInput.value.trim();
      if (!base) { setStatus("err", "Enter a worker URL first."); return; }

      const url = prompt ? `${base}/?prompt=${encodeURIComponent(prompt)}` : base;

      runBtn.disabled = true;
      gameImage.style.display = "none";
      imgPlaceholder.style.display = "flex";
      imgPlaceholder.textContent = "Calling worker...";
      rawJson.textContent = "—";
      setStatus("pending", "⏳ Requesting gameData from worker...");

      const startedAt = performance.now();

      let data;
      try {
        const res = await fetch(url);
        const text = await res.text();
        rawJson.textContent = text;
        if (!res.ok) throw new Error(`Worker responded with HTTP ${res.status}`);
        data = JSON.parse(text);
      } catch (err) {
        setStatus("err", "❌ Worker call failed: " + err.message);
        imgPlaceholder.textContent = "⚠️ Could not reach worker.";
        runBtn.disabled = false;
        return;
      }

      if (!data.image_url) {
        setStatus("err", "❌ Worker response had no image_url field.");
        imgPlaceholder.textContent = "⚠️ No image_url in response.";
        runBtn.disabled = false;
        return;
      }

      setStatus("pending", "⏳ Worker OK. Loading image from Pollinations (this can take 5–20s while it generates)...");
      imgPlaceholder.textContent = "Generating image...";

      gameImage.onload = () => {
        const ms = Math.round(performance.now() - startedAt);
        imgPlaceholder.style.display = "none";
        gameImage.style.display = "block";
        setStatus("ok", `✅ Image loaded successfully in ${ms}ms.`);
        runBtn.disabled = false;
      };
      gameImage.onerror = () => {
        imgPlaceholder.textContent = "⚠️ Failed to load image from Pollinations.";
        setStatus("err", "❌ image_url returned by the worker did not load as an image (network error, CORS, or generation failure).");
        runBtn.disabled = false;
      };

      gameImage.src = data.image_url;
    }

    runBtn.addEventListener("click", runTest);
  </script>
</body>
</html>
